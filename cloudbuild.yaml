# Google Cloud Build configuration for Cloud Run deployment
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/accesstokendropbox:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/accesstokendropbox:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/accesstokendropbox:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/accesstokendropbox:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'accesstokendropbox'
      - '--image'
      - 'gcr.io/$PROJECT_ID/accesstokendropbox:$COMMIT_SHA'
      - '--region'
      - 'us-central1'  # Change to your preferred region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'  # Change if you want authentication
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,SECRET_NAME=dropbox-access-token'
      - '--set-secrets'
      - 'API_SECRET_KEY=api-secret-key:latest,DROPBOX_APP_KEY=dropbox-app-key:latest,DROPBOX_APP_SECRET=dropbox-app-secret:latest'
      - '--service-account'
      - 'accesstokendropbox-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '60s'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'

images:
  - 'gcr.io/$PROJECT_ID/accesstokendropbox:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/accesstokendropbox:latest'

options:
  logging: CLOUD_LOGGING_ONLY
