# Google Cloud Build configuration for Cloud Run deployment
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ai/accesstokendropbox:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ai/accesstokendropbox:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ai/accesstokendropbox:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ai/accesstokendropbox:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'accesstokendropbox'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ai/accesstokendropbox:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'APP_NAME=AccessTokenDropbox,DEBUG=False,LOG_LEVEL=INFO,AUTH_MODE=simple,GCP_PROJECT_ID=$PROJECT_ID,SECRET_NAME=dropbox-access-token'
      - '--set-secrets'
      - 'API_SECRET_KEY=api-secret-key:latest,DROPBOX_APP_KEY=dropbox-app-key:latest,DROPBOX_APP_SECRET=dropbox-app-secret:latest'
      - '--service-account'
      - 'secret-manager-sa@ortega-473114.iam.gserviceaccount.com'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '60s'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/ai/accesstokendropbox:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/ai/accesstokendropbox:latest'

options:
  logging: CLOUD_LOGGING_ONLY
